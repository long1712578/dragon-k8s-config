# ============================================================================
# Reusable Workflow: Container Security Scanning
# ============================================================================
# Usage:
# jobs:
#   security:
#     uses: ./.github/workflows/container-security.yml
#     with:
#       image: ghcr.io/myorg/myapp:latest
# ============================================================================

name: Container Security Scan

on:
  workflow_call:
    inputs:
      image:
        description: 'Full image name with tag to scan'
        required: true
        type: string
      severity:
        description: 'Minimum severity level to report'
        required: false
        type: string
        default: 'CRITICAL,HIGH,MEDIUM'
      fail-on-critical:
        description: 'Fail workflow if critical vulnerabilities found'
        required: false
        type: boolean
        default: true
    secrets:
      github-token:
        required: true

jobs:
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ inputs.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ inputs.severity }}
          exit-code: ${{ inputs.fail-on-critical && '1' || '0' }}

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate human-readable report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ inputs.image }}
          format: 'table'
          output: 'trivy-report.txt'
          severity: ${{ inputs.severity }}

      - name: Upload detailed report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-report
          path: trivy-report.txt

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.github-token }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('trivy-report.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🔒 Security Scan Results\n\n```\n' + report + '\n```'
            });

  grype-scan:
    name: Grype Additional Scan
    runs-on: ubuntu-latest
    steps:
      - name: Run Grype scanner
        uses: anchore/scan-action@v3
        id: grype
        with:
          image: ${{ inputs.image }}
          fail-build: false
          severity-cutoff: high

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}

  dockle-lint:
    name: Dockle Image Linting
    runs-on: ubuntu-latest
    steps:
      - name: Run Dockle
        uses: erzz/dockle-action@v1
        with:
          image: ${{ inputs.image }}
          exit-code: '1'
          exit-level: WARN

  summary:
    name: Security Summary
    needs: [trivy-scan, grype-scan, dockle-lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Create summary
        run: |
          {
            echo "## 🔒 Container Security Scan Complete"
            echo ""
            echo "**Image:** \`${{ inputs.image }}\`"
            echo ""
            echo "| Scanner | Status |"
            echo "|---------|--------|"
            echo "| Trivy   | ${{ needs.trivy-scan.result }} |"
            echo "| Grype   | ${{ needs.grype-scan.result }} |"
            echo "| Dockle  | ${{ needs.dockle-lint.result }} |"
            echo ""
            echo "Check the 'Security' tab for detailed vulnerability reports."
          } >> $GITHUB_STEP_SUMMARY
