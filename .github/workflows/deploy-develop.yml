# ─────────────────────────────────────────────────────────────────────────────
# EMERGENCY MANUAL DEPLOY — Chỉ dùng khi ArgoCD không hoạt động
#
# Primary CD: ArgoCD tự động sync từ deploy/develop/ → cluster
#             (Xem: apps/dragon-develop.yaml)
#
# Workflow này là "escape hatch" — chạy thủ công khi cần:
#   - Bootstrap lần đầu (trước khi ArgoCD được cài)
#   - Emergency hotfix khi ArgoCD bị lỗi
#   - Apply một manifest cụ thể nhanh
# ─────────────────────────────────────────────────────────────────────────────
name: Emergency Manual Deploy (Develop)

on:
  # Chỉ trigger thủ công — KHÔNG auto-trigger khi push
  workflow_dispatch:
    inputs:
      service:
        description: 'Service cần deploy (vd: dragon-business, identity-service, api-gateway). Để trống = deploy tất cả'
        required: false
        default: ''
      reason:
        description: 'Lý do deploy thủ công'
        required: true
        default: 'ArgoCD unavailable'

concurrency:
  group: 'emergency-deploy-develop'
  cancel-in-progress: false

env:
  NAMESPACE: dragon-develop
  DEPLOY_DIR: deploy/develop

jobs:
  deploy:
    name: Emergency Deploy to Develop
    runs-on: [self-hosted, develop]

    steps:
      - name: Checkout k8s config repository
        uses: actions/checkout@v4

      # Kubeconfig decode → isolated path tránh race condition giữa parallel runs
      - name: Setup kubeconfig
        run: |
          KUBECONFIG_PATH="/tmp/kubeconfig-${{ github.run_id }}"
          echo "${{ secrets.KUBECONFIG_DEVELOP }}" | base64 -d > "${KUBECONFIG_PATH}"
          chmod 600 "${KUBECONFIG_PATH}"
          echo "KUBECONFIG=${KUBECONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Ensure namespace
        run: kubectl apply -f "${{ env.DEPLOY_DIR }}/namespace.yaml"

      # Tạo / cập nhật GHCR pull secret (idempotent)
      - name: Ensure GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=long1712578 \
            --docker-password="${{ secrets.GHCR_TOKEN }}" \
            --namespace="${{ env.NAMESPACE }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Resolve services to deploy
        id: resolve
        run: |
          INPUT="${{ github.event.inputs.service }}"
          if [ -z "${INPUT}" ]; then
            # Deploy tất cả (trừ namespace.yaml)
            SERVICES=$(ls "${{ env.DEPLOY_DIR }}"/*.yaml \
              | grep -v 'namespace\.yaml' \
              | xargs -I{} basename {} .yaml \
              | tr '\n' ' ' | xargs)
            echo "Deploying ALL services: ${SERVICES}"
          else
            SERVICES="${INPUT}"
            echo "Deploying specific service: ${SERVICES}"
          fi
          echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"

      - name: Apply manifests
        run: |
          for service in ${{ steps.resolve.outputs.services }}; do
            MANIFEST="${{ env.DEPLOY_DIR }}/${service}.yaml"
            if [ ! -f "${MANIFEST}" ]; then
              echo "⚠️ Manifest not found: ${MANIFEST} — skipping"
              continue
            fi
            echo "▶ Applying ${MANIFEST}"
            kubectl apply -f "${MANIFEST}"

            NS=$(grep "namespace:" "${MANIFEST}" | head -n 1 | awk '{print $2}' || echo "${{ env.NAMESPACE }}")
            if kubectl get deployment "${service}" -n "${NS}" &>/dev/null; then
              echo "⏳ Waiting rollout: ${service} in ${NS}"
              kubectl rollout status deployment/${service} -n "${NS}" --timeout=300s
            fi
          done

      - name: Show pod status
        if: always()
        run: kubectl get pods -n "${{ env.NAMESPACE }}" -o wide

      - name: Job Summary
        if: always()
        run: |
          {
            echo "## 🚨 Emergency Deploy — Develop"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Services   | \`${{ steps.resolve.outputs.services }}\` |"
            echo "| Reason     | \`${{ github.event.inputs.reason }}\` |"
            echo "| Namespace  | \`${{ env.NAMESPACE }}\` |"
            echo "| By         | \`${{ github.actor }}\` |"
            echo ""
            echo "> ⚠️ This was a **manual emergency deploy**. ArgoCD may re-sync and override if still running."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f "${KUBECONFIG}"